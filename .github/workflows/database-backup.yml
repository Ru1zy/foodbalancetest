name: Encrypted PostgreSQL backup

on:
  schedule:
    # Daily at 03:20 UTC. The existing archive cron runs at 02:00 UTC.
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      verify_restore:
        description: "Restore into a temporary database and compare core tables"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: foodbalance-postgres-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      VERIFY_RESTORE: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_restore || false }}
      BACKUP_RECIPIENT_FILE: .github/backup-recipient.pub
      BACKUP_POSTGRES_IMAGE: postgres:18-bookworm
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install encryption client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends age
          age --version
          aws --version

      - name: Dump, optionally verify, encrypt, and upload
        run: bash scripts/backup-postgres.sh
