name: Apply OrderDay schema and backfill

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_ORDER_DAYS to update the Railway database
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "APPLY_ORDER_DAYS"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply additive Prisma schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: npx prisma db push

      - name: Preview legacy backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: node scripts/backfill-order-days.mjs

      - name: Backfill existing orders
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: node scripts/backfill-order-days.mjs --apply
